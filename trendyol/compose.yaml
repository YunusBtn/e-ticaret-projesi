name: trendyol

services:
  db:
    image: postgres:18
    container_name: trendyol-db
    environment:
      POSTGRES_DB: trendyol
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME .env içinde tanımlı değil}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env içinde tanımlı değil}
      TZ: Europe/Istanbul
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    image: trendyol-app:local
    container_name: trendyol-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trendyol?currentSchema=trendyol
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME .env içinde tanımlı değil}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env içinde tanımlı değil}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env içinde tanımlı değil}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME .env içinde tanımlı değil}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL .env içinde tanımlı değil}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD .env içinde tanımlı değil}
      JAVA_TOOL_OPTIONS: -Duser.timezone=Europe/Istanbul
      TZ: Europe/Istanbul
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata: