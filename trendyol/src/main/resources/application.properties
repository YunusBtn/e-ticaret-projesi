spring.application.name=trendyol
spring_profiles_active=dev
#database bilgileri
spring.datasource.url=jdbc:postgresql://localhost:5432/trendyol?currentSchema=trendyol
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#jwt
jwt.expiration=${JWT_EXPIRATION}
jwt.secret=${JWT_SECRET}
#kimlik bilgileri
app.admin.username=${ADMIN_USERNAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.seed.enabled=false
#hibernate islemleri
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=trendyol
#flyway
spring.flyway.schemas=trendyol
#pageable/sorting islemleri
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=20
#swagger
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false













